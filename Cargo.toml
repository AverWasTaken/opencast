[package]
name = "opencast"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "An open-source, keyboard-first desktop file launcher and calculator, built in Rust"
license = "MIT"
repository = "https://github.com/AverWasTaken/opencast"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
open = "5"
meval = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Security"] }
window-vibrancy = "0.6"
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
eframe = { version = "0.33", default-features = false, features = ["wgpu"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
